[package]
name = "trajdl_rust"
version = "0.2.0"
edition = "2024"
description = "A python toolbox for Trajectory Deep Learning."
license = "Apache-2.0"
rust-version = "1.85"
homepage = "https://github.com/Spatial-Temporal-Data-Mining/TrajDL"
repository = "https://github.com/Spatial-Temporal-Data-Mining/TrajDL"
documentation = "https://trajdl.readthedocs.io/en/latest/"
# sdist whitelist: only build-critical files ship with the package.
# Without this, maturin's default cargo manifest path would vendor the
# whole VCS tree (dev/, .github/, py_tests/, docs/, scripts/, ...) into
# the source distribution. Cargo always adds Cargo.toml(.orig), Cargo.lock
# and .cargo_vcs_info.json on top of this list.
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/src/**",
  "/python/**",
  # include mode bypasses gitignore, so exclude bytecode caches and
  # locally built extension modules explicitly to keep a dirty-tree
  # sdist byte-clean (stale .so files must never ship inside the sdist;
  # maturin rebuilds and injects the extension itself).
  "!/python/**/__pycache__/**",
  "!/python/**/*.so",
  "!/python/**/*.pyd",
]

[lib]
name = "trajdl_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow = { version = "56.2.0", features = ["pyarrow"] }
bincode = "1.3.3"
itertools = "0.14.0"
ndarray = "0.17.1"
numpy = "0.25.0"
pyo3 = { version = "0.25.1", features = ["serde"] }
pyo3-stub-gen = "0.13.1"
pyo3-stub-gen-derive = "0.13.1"
rand = "0.9.2"
rand_distr = "0.5"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
rayon = "1.10"
traj-dist-rs = "1.0.0-rc.4"
strum = "0.26"
strum_macros = "0.26"

[dev-dependencies]
float-cmp = "0.10.0"
